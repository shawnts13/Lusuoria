server:
  port: ${PORT:18080}

spring:
  application:
    name: lusuoria-settlement

  datasource:
    url: jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require
    username: postgres.howghxmumvgririurroc
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3          # Render 免费版 512MB 内存，严格限制连接数
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 30000         # Supabase 免费版连接会断开，保持心跳

  jpa:
    open-in-view: false             # 关闭 open-in-view，请求结束后立即释放数据库连接
    hibernate:
      ddl-auto: update              # 首次部署后建议改为 validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        jdbc:
          time_zone: Asia/Shanghai

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# JWT
jwt:
  secret: ${JWT_SECRET:lusuoria-settlement-jwt-secret-2024-please-change-me}
  expiration: 86400000              # 24小时（毫秒）

# CORS 允许的前端域名
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000,https://lusuoria-frontend.vercel.app}

# 前端地址，Google OAuth 授权走完之后跳转回"账号管理"页面用
app:
  frontend-url: ${APP_FRONTEND_URL:https://lusuoria-frontend.vercel.app}
  # 本服务自己的公网地址，拼 Google OAuth 的 redirect_uri（必须跟 Google Cloud Console 里
  # OAuth 客户端配置的"已获授权的重定向 URI"完全一致，包括末尾这段 /api/google-drive-auth/callback）
  base-url: ${APP_BASE_URL:https://lusuoria.onrender.com}

# 数据库每日全量备份（2026-07-29 新增，见 DbBackupService/GoogleDriveAuthService）
backup:
  google-drive:
    # 目标 Google Drive 文件夹 id（来自 https://drive.google.com/drive/folders/<这一段>）
    folder-id: ${GOOGLE_DRIVE_BACKUP_FOLDER_ID:1KNz3r_SDDxkupki7i2b6zXgL_CDdZjAp}
  google-oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:${app.base-url}/api/google-drive-auth/callback}

# Actuator（Render 健康检查）
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.lusuoria: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN